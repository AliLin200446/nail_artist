<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece7de"><meta name="description" content="Ten little canvases. Pick up a polish and make something with your hands."><title>Nail Study — a little time on your hands</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='3' width='16' height='26' rx='8' fill='%23b82d1f'/%3E%3Cpath d='M12 10v9' stroke='%23f3eee4' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head><body>
<main id="workspace" aria-label="Interactive nail painting table"><div id="scene"></div><div id="loading">Setting the table<span>Just a moment.</span></div>
<div class="signature">nail study<span>NO. 01 / YOUR OWN HAND</span></div>
<div class="top-actions"><button id="sound" aria-label="Enable tactile sounds" aria-pressed="false">sound off</button><button id="done">done <span>↗</span></button></div>
<div id="guide"><span class="guide-number">01 — 10</span><p>A little time on your hands.</p><span>Pick a polish. Drag across a nail.</span></div>
<div class="table-objects"><section class="polish-zone" aria-label="Polish bottles"><div class="tray" id="tray"></div><div class="tray-caption"><span id="polish-name">01 / TOMATO</span><button id="next-colors" aria-label="Slide to more polish colors">more polish ⟶</button></div></section>
<section class="tool-zone" aria-label="Nail art tools"><div class="tools"><button class="tool selected" data-tool="brush" aria-label="Polish brush" aria-pressed="true"><span class="implement brush"><i></i></span><span class="tool-label">brush</span></button><button class="tool" data-tool="liner" aria-label="Fine liner brush" aria-pressed="false"><span class="implement liner"><i></i></span><span class="tool-label">liner</span></button><button class="tool" data-tool="dot" aria-label="Dotting tool" aria-pressed="false"><span class="implement dot"><i></i></span><span class="tool-label">dot</span></button><button class="tool" data-tool="erase" aria-label="Cotton swab eraser" aria-pressed="false"><span class="implement swab"><i></i></span><span class="tool-label">clean</span></button></div></section></div>
<div class="bottom-line"><button id="undo" aria-label="Undo last stroke" title="Undo · ⌘Z / Ctrl+Z" disabled>↶ <span>undo</span></button><span id="status" role="status">Nothing to get right. Just make a mark.</span><span class="zoom-hint">double-tap a nail to get closer</span></div><div id="cursor"><span></span></div><button id="back" hidden>↙ back to making</button><div id="toast" role="status"></div>
</main><script type="module" src="./app.js"></script></body></html>
