<!doctype html><meta charset="utf-8"><title>Editor hierarchy checks</title><pre id="results">Loading the workstation…</pre><iframe src="../dist/index.html" title="Editor test fixture" style="width:1280px;height:720px;border:0"></iframe>
<script type="module">
const checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push('PASS '+s);},frame=document.querySelector('iframe');
try{
 await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));const d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<100&&!d.querySelector('.nail-entry');i++)await new Promise(r=>setTimeout(r,100));const root=d.querySelector('#workspace'),click=s=>{const b=d.querySelector(s);if(!b)throw Error('Missing control: '+s);b.click();};
 assert(JSON.stringify([...d.querySelectorAll('.tools [data-tool]')].map(b=>b.dataset.tool))===JSON.stringify(['brush','liner','dot','fan','erase']),'primary tool row contains only the five application tools');
 assert(d.querySelectorAll('[data-section]').length===4&&d.querySelectorAll('.discovery-tray canvas').length===3,'NAIL, COLOR, FINISH and OBJECTS are directly discoverable with object illustrations');
 click('[data-section=nail]');assert(d.querySelectorAll('.shape-options svg').length===7&&new Set([...d.querySelectorAll('.shape-options svg path:first-child')].map(p=>p.getAttribute('d')+p.getAttribute('stroke-dasharray'))).size===7,'every shape has a distinguishable illustrated silhouette');assert(d.querySelector('.shape-settings').textContent.includes('target'),'length and target share the nail workspace');
 click('[data-object-category=crystals]');assert(!d.querySelector('.shape-options')&&d.querySelectorAll('.object-sheet canvas').length===11,'crystal tray replaces shape controls and preserves existing crystal shapes');click('[aria-label="Statement gem"]');assert(root.classList.contains('carrying-charm')&&root.dataset.tool==='pick','selecting a crystal automatically starts placement');
 click('[data-tool=brush]');assert(!root.classList.contains('carrying-charm'),'choosing a brush ends placement without adding an object');
 click('[data-object-category=stickers]');assert(d.querySelectorAll('.object-sheet canvas').length===10,'all ten stickers are represented by artwork');click('[data-object-category=metal]');assert(d.querySelectorAll('.metal-tray canvas').length===12,'three metal finishes each show all four bead sizes');
 click('[data-section=color]');assert(d.querySelectorAll('.polish-library .bottle').length===10&&!d.querySelector('.metal-tray'),'color library replaces the decoration detail area');click('.polish-library [aria-label="Cobalt polish"]');assert(d.querySelector('.polish-library [aria-label="Cobalt polish"]').getAttribute('aria-pressed')==='true'&&d.querySelector('#polish-name').textContent.includes('COBALT'),'expanded color library stays synchronized with selected pigment');click('[data-section=finish]');assert(d.querySelectorAll('.finish-library button').length===8&&!d.querySelector('.polish-library'),'finish replaces color with all eight existing materials');
 click('.finish-library [data-material=jelly]');assert(d.querySelector('.finish-library [data-material=jelly]').getAttribute('aria-pressed')==='true','expanded finish library stays synchronized with selected material');click('[data-tool=stamp]');assert(root.dataset.tool==='stamp'&&!d.querySelector('.tools [data-tool=stamp]'),'design transfer remains available outside the primary creation tools');
 document.querySelector('#results').textContent=checks.join('\n')+'\nALL HIERARCHY CHECKS PASSED';frame.hidden=true;
}catch(e){document.querySelector('#results').textContent=checks.join('\n')+'\nFAIL '+e.stack;}
</script>
