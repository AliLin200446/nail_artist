<!doctype html><meta charset="utf-8"><title>Toolbox workflow checks</title><pre id="results">Running…</pre><iframe src="../dist/index.html" title="Toolbox desktop fixture" style="width:1280px;height:720px;border:0"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push('PASS '+s);},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{await new Promise(r=>frame.addEventListener('load',r,{once:true}));const d=frame.contentDocument,w=frame.contentWindow;for(let i=0;i<100&&!d.querySelector('#toolbox-case');i++)await wait(100);await wait(500);const root=d.querySelector('#workspace'),q=s=>d.querySelector(s),click=s=>{if(!q(s))throw Error('Missing '+s);q(s).click();},bench=q('#workbench'),canvas=q('#scene canvas');
const saved=()=>JSON.parse(w.localStorage.getItem('nail-study-v1'));const separated=()=>canvas.getBoundingClientRect().bottom<=bench.getBoundingClientRect().top+.5;
assert(!root.classList.contains('workbench-open')&&separated(),'closed case gives canvas its own unobstructed viewport');click('#toolbox-case');await wait(480);assert(q('#workbench-nav').children.length===4&&bench.dataset.home==='true','one case opens four illustrated compartments');assert(separated(),'open toolbox reserves space below canvas');
click('#workbench-nav [data-section=color]');assert(q('.polish-library').children.length>=10&&q('.finish-library').children.length===8,'POLISH combines bottles, custom colors and all eight materials');click('.finish-library [data-material=jelly]');assert(q('.finish-library [data-material=jelly]').getAttribute('aria-pressed')==='true','material selection remains synchronized');click('.polish-library [aria-label="Cobalt polish"]');assert(!root.classList.contains('workbench-open')&&root.dataset.tool==='brush','taking a bottle closes case with painting tool ready');
click('#toolbox-case');click('#workbench-nav [data-section=tools]');assert(q('.tools').children.length===5&&q('.transfer-entry').closest('#context-zone'),'five illustrated application tools and design transfer remain accessible');click('.tools [data-tool=liner]');click('.toolbox-bar button:last-child');assert(root.dataset.tool==='liner','closing case preserves chosen application tool');
click('#toolbox-case');click('#workbench-nav [data-section=nail]');assert(q('.shape-options').children.length===7&&q('.shape-settings').textContent.includes('target'),'NAILS exposes seven silhouettes, lengths and application target');
click('#workbench-nav [data-section=objects]');q('.object-tabs').children[0].click();assert(q('.object-sheet').children.length===11,'CHARMS opens all crystal shapes');click('[aria-label="heart crystal"]');assert(root.classList.contains('carrying-charm'),'selecting crystal activates placement');click('.toolbox-bar button:last-child');assert(root.classList.contains('carrying-charm'),'closing toolbox preserves placement mode');
click('#toolbox-case');click('#workbench-nav [data-section=objects]');q('.object-tabs').children[1].click();assert(q('.object-sheet').children.length===10,'stickers remain illustrated and available');q('.object-tabs').children[2].click();assert(q('.metal-tray').querySelectorAll('canvas').length===12,'metal tray preserves finishes and bead sizes');click('.more-objects');assert(q('#charm-dish').closest('#workbench'),'original physical charms remain inside toolbox');
click('#workbench-nav [data-section=color]');click('#context-zone .more-objects');assert(q('#color-picker').closest('#workbench')&&!q('#color-picker').hidden,'custom color picker stays in reserved toolbox');q('#color-picker [maxlength]').value='#6F83C8';q('#color-picker').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));await wait(500);assert(saved().workstation.custom==='#6F83C8'&&!root.classList.contains('workbench-open'),'custom pigment persists and returns to canvas');
// Genuine wheel navigation and layout checks across all requested zoom levels.
for(const z of [.65,1,1.89,3,4]){const current=saved().view.zoom,r=canvas.getBoundingClientRect();canvas.dispatchEvent(new w.WheelEvent('wheel',{clientX:r.left+r.width*.43,clientY:r.top+r.height*.6,deltaY:-Math.log(z/current)/.002,bubbles:true,cancelable:true}));await wait(400);const before=saved().view;click('#toolbox-case');await wait(470);assert(separated(),'canvas/toolbox separation at '+Math.round(z*100)+'%');click('#workbench-nav [data-section=objects]');click('.toolbox-bar button:last-child');await wait(470);assert(JSON.stringify(saved().view)===JSON.stringify(before),'open/close preserves zoom and pan at '+Math.round(z*100)+'%');}
frame.style.width='390px';frame.style.height='720px';click('#toolbox-case');await wait(500);assert(separated(),'mobile drawer reserves canvas space');click('#workbench-nav [data-section=tools]');await wait(100);assert(q('#context-zone').scrollHeight>=q('#context-zone').clientHeight&&separated(),'mobile compartment contents scroll inside the toolbox');
document.querySelector('#results').textContent=checks.join('\n')+'\nALL TOOLBOX CHECKS PASSED';frame.hidden=true;
}catch(e){document.querySelector('#results').textContent=checks.join('\n')+'\nFAIL '+e.stack;}
</script>
